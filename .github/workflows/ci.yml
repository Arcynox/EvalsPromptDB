name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15', 'pypy3.11']
        include:
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.15'
          - os: macos-latest
            python: '3.15'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install build twine mypy
      - run: python -m mypy --python-version 3.10 promptdb
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --no-deps dist/*.whl
      - run: promptdb --version
        working-directory: ${{ runner.temp }}
      - name: Test installed CLI
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_cli.py -v
        working-directory: ${{ runner.temp }}
