[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evals-promptdb"
dynamic = ["version"]
description = "A local, embedded SQLite database for versioned LLM prompts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["llm", "prompts", "versioning", "evaluation", "sqlite"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.scripts]
promptdb = "promptdb.cli:main"

[project.urls]
Repository = "https://github.com/Arcynox/EvalsPromptDB"
Documentation = "https://github.com/Arcynox/EvalsPromptDB#readme"
Issues = "https://github.com/Arcynox/EvalsPromptDB/issues"

[tool.setuptools]
packages = ["promptdb"]

[tool.setuptools.package-data]
promptdb = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "promptdb._version.__version__"}
